<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Insight — LIFE by Dr. Pat</title>
<link rel="stylesheet" href="/design-system/tokens.css"><link rel="stylesheet" href="/journey/static/journey.css">
<script src="/timeline/vendor/react.min.js"></script><script src="/timeline/vendor/react-dom.min.js"></script><script src="/timeline/vendor/babel.min.js"></script>
<script type="text/babel" src="/journey/static/journey-shared.js"></script>
<style>
  .kgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 16px; }
  .kcard { background: #fff; border: 1px solid var(--border-soft); border-radius: 8px; padding: 16px 18px 12px; display: flex; flex-direction: column; gap: 8px; }
  .kcard.nodata { background: #FBF8F3; }
  .khead { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .klabel { font-size: 18px; font-weight: 700; color: var(--ink); line-height: 1.25; }
  .ksrc { font-size: 12.5px; font-weight: 600; color: #4B3A43; margin-top: 3px; }
  .kvals { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .kval { font-size: 34px; font-weight: 700; line-height: 1; color: var(--sapphire-deep); }
  .kval.below_competence { color: var(--ruby); } .kval.competent { color: #B45309; } .kval.benchmark { color: var(--emerald); } .kval.none { color: #6B5A63; }
  .kref { display: flex; flex-direction: column; gap: 3px; font-size: 13.5px; font-weight: 700; color: #1F1217; }
  .kref span { display: inline-flex; align-items: center; gap: 7px; }
  .kref i { display: inline-block; width: 22px; border-top: 3px solid; }
  .kref i.comp { border-top-style: dashed; border-color: #B45309; } .kref i.bench { border-color: var(--emerald); }
  .knote { font-size: 12.5px; color: #4B3A43; font-weight: 500; line-height: 1.4; }
  .kchart { width: 100%; height: auto; display: block; }
  .kchart text { font-family: 'Cloud', system-ui, sans-serif; }
  .legend { display: flex; gap: 22px; flex-wrap: wrap; align-items: center; font-size: 14px; font-weight: 700; }
  .legend span { display: inline-flex; align-items: center; gap: 8px; }
  .legend .sw { width: 16px; height: 16px; border-radius: 4px; display: inline-block; }
  .legend i { display: inline-block; width: 26px; border-top: 3px solid; }
  .tally { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .tally .stat { border: 1px solid var(--border-soft); border-radius: 6px; }
  .seg { display: inline-flex; border: 1.5px solid #CFC2B4; border-radius: 999px; overflow: hidden; background: #fff; }
  .seg button { border: 0; background: transparent; padding: 8px 16px; font-weight: 700; font-size: 14px; color: var(--sapphire-deep); cursor: pointer; }
  .seg button.on { background: var(--sapphire-deep); color: #fff; }
  .chk { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; }
  .chk input { width: 18px; height: 18px; }
  .sechead { display: flex; align-items: center; gap: 12px; margin: 26px 0 12px; }
  .sechead h2 { margin: 0; font-size: 22px; font-weight: 700; color: var(--ink); }
  .sechead .muted { font-weight: 600; }
</style>
</head><body><div id="root"></div>
<script type="text/babel">
requireLogin();
const J = '/api/v1/journey';
const C = { ruby: '#E0115F', amber: '#B45309', emerald: '#009473', sapphire: '#0F52BA', deep: '#151667', gray: '#B9AEA3', grid: '#E9E0D3', ink: '#2A1720', text: '#4B3A43' };
const STATUS_TXT = { below_competence: ['Below competence', 'ต่ำกว่าเกณฑ์ competence'], competent: ['Competent', 'ผ่านเกณฑ์ competence'], benchmark: ['Benchmark', 'ถึงระดับ benchmark'], none: ['No target set', 'ยังไม่กำหนดเป้า'] };
const STATUS_PILL = { below_competence: 'failed', competent: 'blocked', benchmark: 'done', none: 'gray' };
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MONTHS_TH = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
const HEADLINE = ['icsi_normal_fertilisation_rate_pct', 'blastocyst_development_rate_pct', 'clinical_pregnancy_rate_per_et_pct', 'steps_electronically_witnessed_pct'];

/* mirrors kpi.status_of on the server, so monthly bars get the same colour rule as the period value */
function statusOf(b, v) {
  if (v == null || !b || b.competence == null) return null;
  const higher = b.direction === 'higher', comp = b.competence, bench = b.benchmark;
  if (higher) { if (bench != null && v >= bench) return 'benchmark'; return v >= comp ? 'competent' : 'below_competence'; }
  if (bench != null && v <= bench) return 'benchmark';
  return v <= comp ? 'competent' : 'below_competence';
}
const statusColor = s => s === 'below_competence' ? C.ruby : s === 'competent' ? '#F59E0B' : s === 'benchmark' ? C.emerald : C.sapphire;
function niceMax(m) { if (m <= 0) return 5; const steps = [1, 2, 5, 10, 20, 25, 40, 50, 60, 80, 100, 150, 200, 300, 500, 1000, 2000, 5000]; for (const s of steps) if (m <= s) return s; return Math.ceil(m / 1000) * 1000; }
function monthLabel(lang, ym, first) { const [y, m] = ym.split('-').map(Number); const yy = lang === 'th' ? String(y + 543).slice(2) : String(y).slice(2); return (lang === 'th' ? MONTHS_TH : MONTHS)[m - 1] + (first || m === 1 ? ' ' + yy : ''); }

/* Monthly bar / line chart with competence (dashed) and benchmark (solid) reference lines */
function KpiChart({ lang, series, k, b, mode, isPct }) {
  const W = 560, H = 230, L = 50, R = 126, T = 18, B = 34;
  const iw = W - L - R, ih = H - T - B;
  const vals = series.map(s => s[k] == null ? null : +s[k]);
  const present = vals.filter(v => v != null);
  const comp = b && b.competence != null ? +b.competence : null, bench = b && b.benchmark != null ? +b.benchmark : null;
  let max = Math.max(0, ...present, comp ?? 0, bench ?? 0) * 1.18;
  max = isPct ? Math.min(100, niceMax(max)) : Math.max(4, Math.ceil(niceMax(max) / 4) * 4);   // counts: quarter ticks stay whole numbers
  if (isPct && max < 100 && (comp != null && comp >= max * 0.95 || bench != null && bench >= max * 0.95)) max = niceMax(max * 1.3) > 100 ? 100 : niceMax(max * 1.3);
  const y = v => T + ih - (Math.min(v, max) / max) * ih;
  const n = Math.max(1, series.length), slot = iw / n, bw = Math.min(34, slot * 0.62);
  const x = i => L + slot * i + slot / 2;
  const every = Math.max(1, Math.ceil(40 / slot));                 // thin out value labels when months are packed
  const showLabel = i => (n - 1 - i) % every === 0;                 // the latest month always keeps its label
  const ticks = [0, 0.25, 0.5, 0.75, 1].map(f => f * max);
  const fmt = v => isPct ? (Number.isInteger(v) ? v : +v.toFixed(1)) + '%' : v;
  // keep the two reference labels apart when the lines are close together
  let compLy = comp == null ? null : y(comp) + 4.5, benchLy = bench == null ? null : y(bench) + 4.5;
  if (compLy != null && benchLy != null && Math.abs(compLy - benchLy) < 15) { const mid = (compLy + benchLy) / 2; const upper = Math.min(compLy, benchLy) === compLy ? 'comp' : 'bench'; compLy = upper === 'comp' ? mid - 8 : mid + 8; benchLy = upper === 'bench' ? mid - 8 : mid + 8; }
  const refLine = (v, ly, color, dash, label) => v == null ? null : <g>
    <line x1={L} x2={L + iw} y1={y(v)} y2={y(v)} stroke={color} strokeWidth="2.5" strokeDasharray={dash ? '7 5' : undefined} />
    <text x={L + iw + 7} y={ly} fontSize="12.5" fontWeight="700" fill={color}>{label} {fmt(v)}</text></g>;
  const linePts = vals.map((v, i) => v == null ? null : [x(i), y(v)]);
  let d = '', pen = false;
  linePts.forEach(p => { if (!p) { pen = false; return; } d += (pen ? ' L' : ' M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); pen = true; });
  return <svg className="kchart" viewBox={`0 0 ${W} ${H}`} role="img">
    {ticks.map((t, i) => <g key={i}><line x1={L} x2={L + iw} y1={y(t)} y2={y(t)} stroke={C.grid} strokeWidth={i === 0 ? 1.5 : 1} />
      <text x={L - 7} y={y(t) + 4.5} fontSize="12" fontWeight="700" fill={C.text} textAnchor="end">{fmt(t)}</text></g>)}
    {mode === 'bar' && vals.map((v, i) => v == null ? <rect key={i} x={x(i) - bw / 2} y={T + ih - 3} width={bw} height={3} fill={C.gray} rx="1.5" /> :
      <g key={i}><title>{series[i].month}: {fmt(v)}</title><rect x={x(i) - bw / 2} y={y(v)} width={bw} height={Math.max(2, T + ih - y(v))} fill={statusColor(statusOf(b, v))} rx="3" />
        {showLabel(i) && <text x={x(i)} y={y(v) - 5} fontSize="12.5" fontWeight="700" fill={C.ink} textAnchor="middle">{fmt(v)}</text>}</g>)}
    {mode === 'line' && <g><path d={d} fill="none" stroke={C.deep} strokeWidth="3" strokeLinejoin="round" />
      {vals.map((v, i) => v == null ? <circle key={i} cx={x(i)} cy={T + ih} r="3" fill={C.gray} /> :
        <g key={i}><title>{series[i].month}: {fmt(v)}</title><circle cx={x(i)} cy={y(v)} r="6" fill={statusColor(statusOf(b, v))} stroke="#fff" strokeWidth="2" />
          {showLabel(i) && <text x={x(i)} y={y(v) + (i % 2 ? 20 : -11)} fontSize="12.5" fontWeight="700" fill={C.ink} textAnchor="middle">{fmt(v)}</text>}</g>)}</g>}
    {refLine(comp, compLy, C.amber, true, 'Competence')}
    {refLine(bench, benchLy, C.emerald, false, 'Benchmark')}
    {present.length === 0 && <g><rect x={L + iw / 2 - 92} y={T + ih / 2 - 13} width="184" height="26" rx="13" fill="#fff" stroke={C.grid} />
      <text x={L + iw / 2} y={T + ih / 2 + 5} fontSize="13.5" fontWeight="700" fill="#6B5A63" textAnchor="middle">{lang === 'th' ? 'ยังไม่มีข้อมูลในช่วงนี้' : 'No data in this period'}</text></g>}
    {series.map((s, i) => <text key={i} x={x(i)} y={H - 10} fontSize="12" fontWeight="700" fill={C.text} textAnchor="middle">{monthLabel(lang, s.month, i === 0)}</text>)}
  </svg>;
}

function KpiCard({ lang, k, value, b, label, series, mode }) {
  const isPct = k.endsWith('_pct');
  const st = statusOf(b, value) || 'none';
  const hasTarget = b && b.competence != null;
  const sym = b && b.direction === 'lower' ? '≤' : '≥';
  const fmt = v => v == null ? '—' : isPct ? v + '%' : v;
  const anyData = value != null || series.some(s => s[k] != null);
  const kind = b && b.kind ? b.kind : 'count';
  const kindTag = { KPI: '', PI: '', reference: 'gold', local: 'gray', count: 'gray' }[kind] || '';
  return <div className={'kcard' + (anyData ? '' : ' nodata')}>
    <div className="khead"><div><div className="klabel">{label}</div><div className="ksrc">{b && b.source ? b.source : (lang === 'th' ? 'ตัวนับภายใน FCMS' : 'FCMS count')}</div></div>
      <span className={'tag ' + kindTag}>{kind === 'reference' ? (lang === 'th' ? 'ค่าอ้างอิง' : 'Reference') : kind === 'local' ? (lang === 'th' ? 'เป้าคลินิก' : 'Local') : kind === 'count' ? (lang === 'th' ? 'จำนวน' : 'Count') : kind}</span></div>
    <div className="kvals">
      <div className={'kval ' + (hasTarget ? st : 'none')}>{fmt(value)}</div>
      {hasTarget ? <div className="kref"><span><i className="comp" />Competence {sym} {fmt(b.competence)}</span><span><i className="bench" />Benchmark {b.benchmark == null ? '—' : sym + ' ' + fmt(b.benchmark)}</span></div>
        : <div className="kref" style={{ color: '#6B5A63' }}>{kind === 'count' ? (lang === 'th' ? 'จำนวนรวมในช่วงที่เลือก' : 'Total in the selected period') : (lang === 'th' ? 'ไม่มีค่า consensus — ตั้งเป้าภายในคลินิก' : 'No consensus value — set a local target')}</div>}
      {hasTarget && value != null && <Pill s={STATUS_PILL[st]}>{STATUS_TXT[st][lang === 'th' ? 1 : 0]}</Pill>}
    </div>
    <KpiChart lang={lang} series={series} k={k} b={b} mode={mode} isPct={isPct} />
    {b && b.note && <div className="knote">{b.note}</div>}
  </div>;
}

function Section({ lang, title, tag, data, k, series, mode, hideEmpty }) {
  const keys = Object.keys(data).filter(x => x !== 'counts');
  const shown = keys.filter(x => !hideEmpty || data[x] != null || series.some(s => s[x] != null));
  return <>
    <div className="sechead"><h2>{title}</h2><span className="tag">{tag}</span><span className="muted">{shown.length}/{keys.length} {lang === 'th' ? 'ตัวชี้วัด' : 'indicators'}</span></div>
    {shown.length === 0 ? <div className="card muted">{lang === 'th' ? 'ไม่มีตัวชี้วัดที่มีข้อมูลในช่วงนี้' : 'No indicator has data in this period.'}</div> :
      <div className="kgrid">{shown.map(x => <KpiCard key={x} lang={lang} k={x} value={data[x]} b={k.benchmarks[x]} label={k.labels[x] || x} series={series} mode={mode} />)}</div>}
    <div className="muted" style={{ marginTop: 10, fontSize: 13 }}>{Object.entries(data.counts || {}).map(([a, v]) => `${a}=${v}`).join(' · ')}</div>
  </>;
}

function App() {
  const [lang, setLang] = useLang(); const [toastMsg, toast] = useToast();
  const [range, setRange] = useState({ start: addDays(todayISO(), -365), end: todayISO() });
  const [months, setMonths] = useState(12); const [mode, setMode] = useState(localStorage.getItem('fcms_kpi_chart') || 'bar'); const [hideEmpty, setHideEmpty] = useState(false);
  const [k, setK] = useState(null); const [series, setSeries] = useState([]);
  const load = () => Promise.all([api(`${J}/kpi?start=${range.start}&end=${range.end}`), api(`${J}/kpi/monthly?months=${months}`)]).then(([a, b]) => { setK(a); setSeries(b); }).catch(e => toast(e.message, true));
  useEffect(() => { load(); }, [range.start, range.end, months]);
  const pickMode = m => { setMode(m); localStorage.setItem('fcms_kpi_chart', m); };
  const exportX = async () => openBlob(await api(`${J}/kpi/export.xlsx?start=${range.start}&end=${range.end}`));
  const tally = k ? Object.values(k.status).reduce((a, s) => { a[s || 'none'] = (a[s || 'none'] || 0) + 1; return a; }, {}) : {};
  const th = lang === 'th';
  return <Shell active="/insight" lang={lang} setLang={setLang} title={tr(lang, 'Insight')}
    actions={<><input className="input" type="date" value={range.start} onChange={e => setRange({ ...range, start: e.target.value })} /><span className="muted">→</span><input className="input" type="date" value={range.end} onChange={e => setRange({ ...range, end: e.target.value })} />
      <select className="input" value={months} onChange={e => setMonths(+e.target.value)}>{[6, 12, 18, 24].map(m => <option key={m} value={m}>{m} {th ? 'เดือน' : 'months'}</option>)}</select>
      <div className="seg"><button className={mode === 'bar' ? 'on' : ''} onClick={() => pickMode('bar')}>▮ {th ? 'แท่ง' : 'Bar'}</button><button className={mode === 'line' ? 'on' : ''} onClick={() => pickMode('line')}>⟋ {th ? 'เส้น' : 'Line'}</button></div>
      <label className="chk"><input type="checkbox" checked={hideEmpty} onChange={e => setHideEmpty(e.target.checked)} />{th ? 'ซ่อนตัวชี้วัดที่ไม่มีข้อมูล' : 'Hide indicators without data'}</label>
      <button className="btn primary sm" onClick={exportX}>⬇ {tr(lang, 'Export Excel')}</button></>}>
    {k && <>
      <div className="card ink">
        <h2>{th ? 'ภาพรวมเทียบเกณฑ์' : 'Scorecard against consensus levels'} <span className="tag gold">{k.period.start} → {k.period.end}</span></h2>
        <div className="tally">
          <div className="stat ink"><div className="label">{th ? 'ถึง benchmark' : 'At benchmark'}</div><b style={{ color: '#5CE0B5' }}>{tally.benchmark || 0}</b></div>
          <div className="stat ink"><div className="label">{th ? 'ผ่าน competence' : 'Competent'}</div><b style={{ color: '#F5C26B' }}>{tally.competent || 0}</b></div>
          <div className="stat ink"><div className="label">{th ? 'ต่ำกว่า competence' : 'Below competence'}</div><b style={{ color: '#FF7FB0' }}>{tally.below_competence || 0}</b></div>
          <div className="stat ink"><div className="label">{th ? 'ไม่มีข้อมูล / ไม่มีเป้า' : 'No data / no target'}</div><b style={{ color: '#D9CFC3' }}>{tally.none || 0}</b></div>
        </div>
        <div className="legend" style={{ marginTop: 14, color: '#fff' }}>
          <span><i style={{ borderColor: '#F5C26B', borderTopStyle: 'dashed' }} />{th ? 'เส้นประ = competence (ระดับที่ต้องทำได้)' : 'Dashed line = competence (minimum expected level)'}</span>
          <span><i style={{ borderColor: '#5CE0B5' }} />{th ? 'เส้นทึบ = benchmark (ระดับเป้าหมาย)' : 'Solid line = benchmark (aspirational level)'}</span>
          <span><span className="sw" style={{ background: C.ruby }} />{th ? 'ต่ำกว่า competence' : 'below competence'}</span>
          <span><span className="sw" style={{ background: '#F59E0B' }} />{th ? 'ผ่าน competence' : 'competent'}</span>
          <span><span className="sw" style={{ background: C.emerald }} />{th ? 'ถึง benchmark' : 'at benchmark'}</span>
          <span><span className="sw" style={{ background: C.sapphire }} />{th ? 'ไม่มีเป้า' : 'no target'}</span>
        </div>
        <div className="muted" style={{ marginTop: 10 }}>{th ? 'ตัวชี้วัดที่ "ยิ่งต่ำยิ่งดี" (เช่น ICSI damage, OHSS) จะกลับทิศ: ค่าต่ำกว่าเส้น benchmark ถือว่าถึงเป้า' : 'For "lower is better" indicators (e.g. ICSI damage rate, OHSS) the rule is inverted: a value at or below the benchmark line counts as benchmark.'}</div>
      </div>

      <div className="sechead"><h2>{th ? 'ตัวชี้วัดหลัก' : 'Headline indicators'}</h2></div>
      <div className="kgrid">{HEADLINE.map(x => { const sec = k.laboratory[x] !== undefined ? 'laboratory' : k.clinical[x] !== undefined ? 'clinical' : 'operational'; return <KpiCard key={x} lang={lang} k={x} value={k[sec][x]} b={k.benchmarks[x]} label={k.labels[x] || x} series={series} mode={mode} />; })}</div>

      <Section lang={lang} title={tr(lang, 'Laboratory')} tag="Vienna consensus 2017" data={k.laboratory} k={k} series={series} mode={mode} hideEmpty={hideEmpty} />
      <Section lang={lang} title={tr(lang, 'Clinical')} tag="Maribor consensus 2021" data={k.clinical} k={k} series={series} mode={mode} hideEmpty={hideEmpty} />
      <Section lang={lang} title={tr(lang, 'Operational')} tag="FCMS" data={k.operational} k={k} series={series} mode={mode} hideEmpty={hideEmpty} />

      <div className="sechead"><h2>{th ? 'ตารางรายเดือน' : 'Monthly table'}</h2></div>
      <div className="card"><table className="t"><thead><tr><th>{th ? 'เดือน' : 'Month'}</th><th>{th ? 'รอบที่เริ่ม' : 'Cycles started'}</th><th>OPU</th><th>ET</th><th>{k.labels.icsi_normal_fertilisation_rate_pct}</th><th>{k.labels.blastocyst_development_rate_pct}</th><th>{k.labels.clinical_pregnancy_rate_per_et_pct}</th><th>{k.labels.steps_electronically_witnessed_pct}</th></tr></thead>
        <tbody>{series.map(s => <tr key={s.month}><td><b>{s.month}</b></td><td className="num">{s.cycles_started}</td><td className="num">{s.opus}</td><td className="num">{s.et_cycles}</td>
          {HEADLINE.map(x => <td key={x} className="num" style={{ color: statusColor(statusOf(k.benchmarks[x], s[x])), fontWeight: 700 }}>{s[x] == null ? '—' : s[x] + '%'}</td>)}</tr>)}</tbody></table>
        <div className="muted" style={{ marginTop: 10 }}>{th ? 'แหล่งที่มาของค่า competence / benchmark: ' : 'Sources of competence / benchmark values: '}{k.references.join(' · ')}. {th ? 'ตัวชี้วัดที่ไม่มีค่า consensus จะแสดงเป็น "เป้าคลินิก" และสามารถตั้งค่าได้ใน kpi.py' : 'Indicators without a consensus value are shown as "Local" and can be given a clinic target in the KPI service.'}</div></div>
    </>}
    <Toast msg={toastMsg} />
  </Shell>;
}
ReactDOM.render(<App />, document.getElementById('root'));
</script></body></html>
