[alembic]
# Path to the env.py / script.py.mako directory
script_location = alembic

# Migration files live inside each module — all four dirs are scanned
version_locations = %(here)s/module1/migrations %(here)s/module2/migrations %(here)s/module3/migrations %(here)s/module4/migrations

# Default DB URL — override via DATABASE_URL env var or .env file
sqlalchemy.url = postgresql://fcms_user:fcms_pass@localhost:5432/fcms_db

# Migration filename template
file_template = %%(slug)s_%%(rev)s

# Truncate long revision identifiers in filenames
truncate_slug_length = 40

# Timezone for timestamps in migration files
timezone = Asia/Bangkok

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
